name: Legacy NoevaPet publisher — disabled

# The public NoevaPet production branch is now the qualified P1 static release
# (V26 + REAL CORE v1.0). This legacy main-branch publisher previously rebuilt
# a pre-launch noindex shell and could regress the live acquisition surface.
# It is deliberately fail-closed. Future releases must start from the current
# production authority and pass an explicit Website Gate before promotion.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo 'BLOCKED: legacy NoevaPet main -> production publisher is retired.'
          echo 'Current authority: production branch / P1_LAUNCH_RECEIPT.json.'
          echo 'Required release path: qualified candidate -> Website Gate -> explicit production promotion -> live canary/rollback.'
          exit 2
